[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlassian-mcp"
version = "0.1.0"
description = "Read-only Jira Cloud + Confluence Cloud access (JQL/CQL search, issues, pages, comments), served as a local MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.urls]
Repository = "https://github.com/tealtadpole/local-atlassian-mcp"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atlassian-mcp = "atlassian_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
